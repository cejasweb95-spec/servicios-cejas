<!DOCTYPE html>

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, 'Times New Roman', serif;
      background: linear-gradient(135deg, #fdf6f0 0%, #f5e6dc 100%);

    a.btn:hover {

    .whatsapp {
